[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alvsafe"
version = "0.3.0"
description = "Antivírus e proteção de endpoint em Python, com CLI e interface gráfica"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Alvaro Marcal de Araujo" }]
dependencies = [
    "watchdog>=4",
    "psutil>=5.9",
    "rich>=13",
    "requests>=2.31",
]

[project.optional-dependencies]
yara = ["yara-python>=4.3"]
gui = ["customtkinter>=5.2"]
dev = ["pytest>=8"]

[project.scripts]
alvsafe = "alvsafe.cli:main"
alvsafe-gui = "alvsafe.gui.app:main"

[tool.setuptools.packages.find]
include = ["alvsafe*"]

[tool.setuptools.package-data]
alvsafe = ["data/*.txt", "data/rules/*.yar"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
