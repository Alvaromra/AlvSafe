name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Testes ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Instalar
        run: pip install -e ".[yara,dev]"

      - name: Testes
        run: pytest -q

      - name: Diagnóstico
        # Não falha o build: em runner não há sessão gráfica nem as
        # pastas do usuário, então alguns itens saem como aviso.
        run: alvsafe doctor || true

      - name: Detectar o EICAR de ponta a ponta
        shell: bash
        run: |
          mkdir -p amostras
          printf 'X5O!P%%@AP[4\\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' > amostras/eicar.sh
          alvsafe scan --no-quarantine --json amostras | tee resultado.json
          python -c "import json,sys; d=json.load(open('resultado.json')); sys.exit(0 if len(d['threats'])==1 else 1)"

  gui:
    name: Interface gráfica (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Dependências de tela
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      - name: Instalar
        run: pip install -e ".[yara,gui,dev]"

      - name: Testes com display virtual
        run: xvfb-run -a pytest -q tests/test_gui.py

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
